name: Package Video Catcher v2.9
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official package
        run: |
          unzip -t downloads/Video-Catcher-All-Formats-v2.9.0.zip | tail -n 2
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile("downloads/Video-Catcher-All-Formats-v2.9.0.zip") as z:
              m=json.loads(z.read("manifest.json"))
              assert m["manifest_version"]==3 and m["version"]=="2.9.0"
              for path in ("background.js","content.js","popup.html","popup.js","downloader.js"): assert path in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Catcher-All-Formats-v2.9.0
          path: downloads/Video-Catcher-All-Formats-v2.9.0.zip
